name: CI Quality Gates & Build Optimization

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Code Quality, Security & Automated Testing Gates
  # -------------------------------------------------------------
  quality-gate:
    name: Lint, Test, Security & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DevSecOps Gate 1: Secret Scanning
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # DevSecOps Gate 2: Dependency Security Audit
      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      # Quality Gate 1: Code Style Enforcement
      - name: Run ESLint
        run: npm run lint

      # Quality Gate 2: Automated Unit Tests + 80% Coverage Gate
      - name: Run Unit Tests & Check Coverage
        run: npm test

      # Artifacts Upload
      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # -------------------------------------------------------------
  # Job 2: Optimized Docker Build with Layer Caching & Security Scan
  # -------------------------------------------------------------
  docker-build:
    name: Optimized Multi-Stage Docker Build & Container Security
    needs: [quality-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # इमेज बिल्ड करून स्थानिक डॉकर डेमॉनमध्ये लोड करणे
      - name: Build Docker Image with Layer Caching
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Trivy ला स्कॅन करण्यासाठी इमेज स्थानिक डेमॉनमध्ये लोड करणे
          tags: cloudpulse-api-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # DevSecOps Gate 3: Container Vulnerability Scanning (Trivy)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudpulse-api-app:latest'
          format: 'table'
          exit-code: '1'          # CRITICAL व्हल्नरेबिलिटी सापडल्यास पाइपलाइन FAIL करणे
          ignore-unfixed: true   # ज्यांचा फिक्स उपलब्ध नाही असे बग्स दुर्लक्षित करणे
          severity: 'CRITICAL,HIGH'