name: CI Quality Gates & DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Quality, Secret & Dependency Security Gates
  # -------------------------------------------------------------
  quality-gate:
    name: Lint, Test, Security & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests & Check Coverage
        run: npm test

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # -------------------------------------------------------------
  # Job 2: Multi-Stage Build, Security Scanning, Tagging & Signing
  # -------------------------------------------------------------
  docker-build:
    name: Build, Tag, Scan & Cosign Image
    needs: [quality-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app:local-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app:local-test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app:local-test
          format: 'spdx-json'
          output: 'cloudpulse-sbom.spdx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: cloudpulse-sbom.spdx.json
          retention-days: 14

      - name: Push Docker Image to Docker Hub
        id: build-and-push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign the Published Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app@${{ steps.build-and-push.outputs.digest }}

  # -------------------------------------------------------------
  # Job 3: Automated Staging Deployment & Health Verification
  # -------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and Run Staging Container
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          DOCKER_USER="${{ vars.DOCKERHUB_USERNAME }}"

          echo "Pulling verified image tag: ${IMAGE_TAG} from Docker Hub..."
          docker pull ${DOCKER_USER}/cloudpulse-api-app:${IMAGE_TAG}

          echo "Starting Staging Container..."
          docker run -d --name staging-app -p 3000:3000 ${DOCKER_USER}/cloudpulse-api-app:${IMAGE_TAG}

          echo "Waiting for app to initialize..."
          sleep 5

          docker ps -a

      - name: Verify Staging Health Check
        run: |
          echo "::group::stage-container-logs"
          docker logs staging-app
          echo "::endgroup::"

          curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/health || exit 1
          echo "Staging Deployment & Health Check SUCCESSFUL!"

  # -------------------------------------------------------------
  # Job 4: Gated Production Delivery (Azure VM via SSH)
  # -------------------------------------------------------------
  deploy-production:
    name: Deploy to Production (Azure VM)
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Set Short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> GITHUB_OUTPUT


      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.AZURE_VM_HOST }}
          username: ${{ vars.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script: |
            IMAGE_TAG="sha-${{ steps.vars.outputs.short_sha }}"
            DOCKER_USER="${{ vars.DOCKERHUB_USERNAME }}"

            echo "Pulling latest image (${IMAGE_TAG}) on Azure VM..."
            docker pull ${DOCKER_USER}/cloudpulse-api-app:${IMAGE_TAG}

            echo "Stopping old container..."
            docker stop cloudpulse-api || true
            docker rm cloudpulse-api || true

            echo "Starting new container on Azure VM..."
            docker run -d \
              --name cloudpulse-api \
              --restart unless-stopped \
              -p 3000:3000 \
              ${DOCKER_USER}/cloudpulse-api-app:${IMAGE_TAG}

            echo "Waiting for app to initialize..."
            sleep 5

            echo "Verifying local health check on Azure VM..."
            curl --fail http://127.0.0.1:3000/health || exit 1
            echo "Production Deployment on Azure VM SUCCESSFUL!"