name: CI Quality Gates & DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write # Required for Cosign keyless signing via GitHub OIDC

jobs:
  # -------------------------------------------------------------
  # Job 1: Quality, Secret & Dependency Security Gates
  # -------------------------------------------------------------
  quality-gate:
    name: Lint, Test, Security & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests & Check Coverage
        run: npm test

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14 # Store coverage for 14 days to save storage

  # -------------------------------------------------------------
  # Job 2: Multi-Stage Build, Security Scanning, Tagging & Signing
  # -------------------------------------------------------------
  docker-build:
    name: Build, Tag, Scan & Cosign Image
    needs: [quality-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Metadata Extraction (Dynamic Tagging Strategy)
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & load locally for Trivy scanning
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:local-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # DevSecOps Gate: Trivy Scan
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:local-test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # Generate SBOM (Software Bill of Materials)
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:local-test
          format: 'spdx-json'
          output: 'cloudpulse-sbom.spdx.json'

      # Upload SBOM as an Artifact
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: cloudpulse-sbom.spdx.json
          retention-days: 30

      # Push all tags only after Trivy passes (Only on main push)
      - name: Push Docker Image with Tags to GHCR
        id: build-and-push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Install Cosign
      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      # Sign the image using its exact immutable Digest
      - name: Sign the Published Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign ghcr.io/${{ github.repository }}@${{ steps.build-and-push.outputs.digest }}

  # -------------------------------------------------------------
  # Job 3: Automated Staging Deployment & Health Verification
  # -------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Run Staging Container
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          echo "Pulling verified image tag: ${IMAGE_TAG} from GHCR..."
          docker pull ghcr.io/${{ github.repository }}:${IMAGE_TAG}

          echo "Starting Staging Container..."
          docker run -d --name staging-app -p 3000:3000 ghcr.io/${{ github.repository }}:${IMAGE_TAG}

          echo "Waiting for app to initialize..."
          sleep 5

          echo "Checking container status..."
          docker ps -a

      - name: Verify Staging Health Check
        run: |
          echo "Container Logs:"
          docker logs staging-app

          echo "Verifying /health endpoint..."
          curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/health || exit 1
          echo "Staging Deployment & Health Check SUCCESSFUL!"

  # -------------------------------------------------------------
  # Job 4: Gated Production Delivery (Requires Manual Approval)
  # -------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Run Production Container
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          echo "Pulling verified image tag: ${IMAGE_TAG} from GHCR..."
          docker pull ghcr.io/${{ github.repository }}:${IMAGE_TAG}

          echo "Starting Production Container..."
          docker run -d --name prod-app -p 3000:3000 ghcr.io/${{ github.repository }}:${IMAGE_TAG}

          echo "Waiting for app to initialize..."
          sleep 5

          docker ps -a

      - name: Verify Production Health Check
        run: |
          echo "=== Container Status ==="
          docker inspect --format 'Status: {{.State.Status}}, ExitCode: {{.State.ExitCode}}, Error: {{.State.Error}}' prod-app

          echo "=== Production Container Logs ==="
          docker logs prod-app

          echo "=== Verifying /health endpoint ==="
          curl --fail -v --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:3000/health || exit 1
          echo "Production Release Live & Healthy!"