name: CI Quality Gates & DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Quality, Secret & Dependency Security Gates
  # -------------------------------------------------------------
  quality-gate:
    name: Lint, Test, Security & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests & Check Coverage
        run: npm test

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14


  # -------------------------------------------------------------
  # Job 2: Build, Security Scan, Push & Sign
  # -------------------------------------------------------------
  docker-build:
    name: Build, Scan, Push & Cosign Image
    needs: [quality-gate]
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.build-and-push.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------
      # Build image locally for security scanning
      # ---------------------------------------------------------
      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app:local-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app:local-test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app:local-test
          format: 'spdx-json'
          output: 'cloudpulse-sbom.spdx.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: cloudpulse-sbom.spdx.json
          retention-days: 14

      # ---------------------------------------------------------
      # Push production image
      # ---------------------------------------------------------
      - name: Push Docker Image to Docker Hub
        id: build-and-push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------
      # Install Cosign
      # ---------------------------------------------------------
      - name: Install Cosign
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      # ---------------------------------------------------------
      # Sign exact image digest
      # ---------------------------------------------------------
      - name: Sign the Published Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            ${{ vars.DOCKERHUB_USERNAME }}/cloudpulse-api-app@${{ steps.build-and-push.outputs.digest }}


  # -------------------------------------------------------------
  # Job 3: Automated Staging Deployment & Health Verification
  # -------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    outputs:
      image_digest: ${{ needs.docker-build.outputs.image_digest }}

    steps:

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------
      # Pull EXACT immutable image using digest
      # ---------------------------------------------------------
      - name: Pull and Run Staging Container
        env:
          DOCKER_USER: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
        run: |
          echo "Pulling verified image using immutable digest..."
          docker pull ${DOCKER_USER}/cloudpulse-api-app@${IMAGE_DIGEST}

          echo "Starting Staging Container on Host Network..."
          # --network host वापरल्याने docker-proxy चा रिसेटचा प्रॉब्लेम कायमचा मिटतो
          docker run -d \
            --name staging-app \
            --network host \
            -e PORT=3000 \
            ${DOCKER_USER}/cloudpulse-api-app@${IMAGE_DIGEST}

          echo "Waiting for app to boot..."
          sleep 10

          echo "Container status:"
          docker ps -a

      # ---------------------------------------------------------
      # Staging health verification
      # ---------------------------------------------------------
      - name: Verify Staging Health Check
        run: |
          echo "::group::stage-container-logs"
          docker logs staging-app
          echo "::endgroup::"

          # --retry-all-errors मुळे Connection reset आला तरी तो 10 वेळा पुन्हा प्रयत्न करेल
          curl -iv \
            --fail \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 2 \
            http://127.0.0.1:3000/health

          echo ""
          echo "Staging Deployment & Health Check SUCCESSFUL!"

      - name: Stop Staging Container
        if: always()
        run: |
          echo "Stopping Staging Container..."
          docker stop staging-app || true
          docker rm staging-app || true


  # -------------------------------------------------------------
  # Job 4: Gated Production Delivery - Azure VM
  # -------------------------------------------------------------
  deploy-production:
    name: Deploy to Production (Azure VM)
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.AZURE_VM_HOST }}
          username: ${{ vars.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22

          script: |
            IMAGE_DIGEST="${{ needs.deploy-staging.outputs.image_digest }}"
            DOCKER_USER="${{ vars.DOCKERHUB_USERNAME }}"

            echo "=========================================="
            echo "Production Deployment"
            echo "=========================================="
            echo "Image Digest: ${IMAGE_DIGEST}"

            # ---------------------------------------------------
            # Pull EXACT image verified in staging
            # ---------------------------------------------------
            echo "Pulling exact image from Docker Hub..."

            docker pull \
              ${DOCKER_USER}/cloudpulse-api-app@${IMAGE_DIGEST}

            # ---------------------------------------------------
            # Stop existing container
            # ---------------------------------------------------
            echo "Stopping old container..."

            docker stop cloudpulse-api || true
            docker rm cloudpulse-api || true

            # ---------------------------------------------------
            # Start new production container
            # ---------------------------------------------------
            echo "Starting new production container..."

            docker run -d \
              --name cloudpulse-api \
              --restart unless-stopped \
              -p 3000:3000 \
              ${DOCKER_USER}/cloudpulse-api-app@${IMAGE_DIGEST}

            # ---------------------------------------------------
            # Wait for application startup
            # ---------------------------------------------------
            echo "Waiting for app to initialize..."

            sleep 5

            # ---------------------------------------------------
            # Production health check
            # ---------------------------------------------------
            echo "Verifying production health check..."

            curl \
              --fail \
              --retry 5 \
              --retry-connrefused \
              --retry-delay 2 \
              http://127.0.0.1:3000/health || exit 1

            echo "=========================================="
            echo "Production Deployment SUCCESSFUL!"
            echo "Image Digest: ${IMAGE_DIGEST}"
            echo "=========================================="
      
      # ---------------------------------------------------------
      # Generate Executive DevSecOps Deployment Summary on GitHub UI
      # ---------------------------------------------------------
      - name: Generate DevSecOps Summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # 🚀 CloudPulse Production Deployment Summary

          | Stage | Status | Details |
          | :--- | :---: | :--- |
          | **Quality Gate** | ✅ Passed | ESLint, NPM Audit, 100% Unit Coverage |
          | **Secret Scan** | ✅ Passed | Gitleaks (Zero Secrets Leaked) |
          | **Container Security** | ✅ Passed | Trivy (Zero High/Critical CVEs) + SBOM Generated |
          | **Image Provenance** | 🔐 Signed | Sigstore / Cosign Keyless OCI Signature |
          | **Staging Gate** | ✅ Verified | Container Boot & Self-Health Verified |
          | **Production Target** | 🌐 Live | Azure VM (`/health`, `/healthz`, `/api/v1/pulse`) |
          EOF

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📦 Deployed Artifact Metadata" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit SHA:** {{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered By:** {{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Docker Image Digest:** {{ needs.deploy-staging.outputs.image_digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered By:** {{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Docker Image Digest:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "{{ needs.deploy-staging.outputs.image_digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "- **Live Telemetry URL:** [http://4.224.123.117:3000/](http://4.224.123.117:3000/)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ✨ *This deployment satisfies all enterprise DevSecOps quality, compliance, and immutability controls.*" >> "$GITHUB_STEP_SUMMARY"